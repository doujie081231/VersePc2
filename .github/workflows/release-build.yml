# release-build.yml — 在 GitHub 上构建 macOS（Intel + Apple Silicon）与 Linux 版本，
# 并把安装包直接上传到对应 tag 的 release。
# 刻意只用 `run:` 内置步骤（不依赖任何第三方 action），在任何 Actions 权限设置下都能运行。
# 触发：手动 workflow_dispatch（ref 填 v1.1.1 等 tag）或推送 v* tag。
name: Build macOS & Linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 两种架构都在 macos-14 (ARM) 上构建：
          #   原生 = Apple Silicon (aarch64)；交叉编译 x86_64-apple-darwin = Intel。
          # macos-13 已被 GitHub 退役，不再作为 Intel runner 使用。
          - { os: macos-14, target: x86_64-apple-darwin, label: macOS_x86_64 }
          - { os: macos-14, target: "", label: macOS_arm64 }
          - { os: ubuntu-24.04, target: "", label: Linux_x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (${{ github.ref_name }})
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" https://github.com/doujie081231/VersePc2.git .
          git rev-parse --short HEAD

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ -n "${{ matrix.target }}" ]; then rustup target add "${{ matrix.target }}"; fi
          rustc --version
          cargo --version

      # 关键：直接用 cargo 构建 bin（不等价于 cargo tauri build）。
      # `cargo tauri build` 会构建 cdylib/staticlib crate-type，Linux/mac 上会强制链接所有
      # 依赖里的 #[link]（含 Windows 库），出现 "unable to find library -lkernel32"。
      # 普通 bin 链接只含实际生效的库，可正常通过。前端资源需先 prepare（generate_context! 编译期读取）。
      - name: Prepare frontend assets
        run: node scripts/prepare-frontend.mjs

      # 某些依赖在非 Windows 编译时仍引用少量 Win32 API，但运行时从不真正调用（cfg!(windows) 短路）。
      # 编译仓库内 scripts/winstubs.c 提供 no-op 实现，使这些"死引用"在链接期得到解析。
      - name: Provide Windows no-op stubs (macOS/Linux)
        run: |
          mkdir -p winstubs
          ARCHFLAG=""
          [ -n "${{ matrix.target }}" ] && ARCHFLAG="-arch x86_64"
          cc -c -O2 $ARCHFLAG -o winstubs/stub.o scripts/winstubs.c
          ar rcs winstubs/libkernel32.a winstubs/stub.o
          cp winstubs/libkernel32.a winstubs/libshell32.a
          echo "RUSTFLAGS=-L $(pwd)/winstubs" >> "$GITHUB_ENV"

      - name: Build release binary
        run: |
          TARGET="${{ matrix.target }}"
          ARGS=""
          [ -n "$TARGET" ] && ARGS="--target $TARGET"
          cargo build --release --bin verse-tauri --manifest-path src-tauri/Cargo.toml $ARGS
          # 记录二进制实际路径，供打包步骤使用
          if [ -n "$TARGET" ]; then echo "BUILD_BIN=src-tauri/target/$TARGET/release/verse-tauri" >> "$GITHUB_ENV"; else echo "BUILD_BIN=src-tauri/target/release/verse-tauri" >> "$GITHUB_ENV"; fi

      - name: Package & upload installers
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          BIN="$BUILD_BIN"
          chmod +x "$BIN"
          files=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp "$BIN" "VersePC2-linux-x86_64"
            files+=( "VersePC2-linux-x86_64" )
          elif [ "$RUNNER_OS" = "macOS" ]; then
            APP="VersePC2.app"
            mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"
            cp "$BIN" "${APP}/Contents/MacOS/VersePC2"
            cp src-tauri/Info.plist "${APP}/Contents/Info.plist"
            # 拷贝打包进编译产物的图标（若有）
            [ -f src-tauri/icons/icon.icns ] && cp src-tauri/icons/icon.icns "${APP}/Contents/Resources/icon.icns"
            ARCH="aarch64"; [ -n "${{ matrix.target }}" ] && ARCH="x86_64"
            zip -r "-y" "VersePC2-macos-${ARCH}.zip" "${APP}"
            files+=( "VersePC2-macos-${ARCH}.zip" )
          fi
          echo "uploading: ${files[@]}"
          for f in "${files[@]}"; do
            gh release upload "${TAG}" "$f" --clobber
          done
