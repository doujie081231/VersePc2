# verify.yml — 架构与测试检查
# 触发：手动 workflow_dispatch、推送 main
# 目标：架构护栏、前端语法、Rust 单元测试
name: Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        shell: bash
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" https://github.com/doujie081231/VersePc2.git .
          git rev-parse --short HEAD

      - name: Install frontend deps
        shell: bash
        run: npm ci

      - name: Lint
        shell: bash
        run: npm run lint

      - name: Frontend unit tests with coverage
        shell: bash
        run: npm run test:coverage

      - name: Coverage ratchet
        shell: bash
        run: npm run test:coverage:check

      - name: Test density ratchet
        shell: bash
        run: npm run test:density

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Module cycle check
        shell: bash
        run: npm run arch:cycles

      - name: Dependency audit
        shell: bash
        run: npm run audit

      - name: Build frontend
        shell: bash
        run: npm run build:web

      - name: Architecture report
        shell: bash
        run: node scripts/check-architecture.mjs --strict

  frontend-e2e:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        shell: bash
        run: |
          git clone --depth 1 --branch "$GITHUB_REF_NAME" https://github.com/doujie081231/VersePc2.git .
          git rev-parse --short HEAD

      - name: Install frontend deps
        shell: bash
        run: npm ci

      - name: Install Playwright Chromium
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Frontend E2E smoke
        shell: bash
        run: npm run test:e2e

  rust-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        shell: pwsh
        run: |
          git clone --depth 1 --branch "$env:GITHUB_REF_NAME" https://github.com/doujie081231/VersePc2.git .
          git rev-parse --short HEAD

      - name: Setup Rust (stable)
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustc --version

      # sponsor-orders.json 未入库，但 sponsor.rs 通过 include_str! 编译期嵌入
      - name: Ensure sponsor-orders.json exists
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/data/sponsor-orders.json")) {
            New-Item -ItemType Directory -Force -Path "src-tauri/data" | Out-Null
            [IO.File]::WriteAllBytes("src-tauri/data/sponsor-orders.json", [Convert]::FromBase64String("eyJvcmRlcnMiOltdfQ=="))
            Write-Host "placeholder-written"
          }

      - name: Install frontend deps
        shell: pwsh
        run: npm ci

      - name: Build frontend
        shell: pwsh
        run: npm run build:web

      # 内置 Horizon 运行时未入库（26.9MB 二进制），构建前按脚本拉取；
      # horizon.rs 通过 include_bytes! 编译期嵌入，缺文件会直接编译失败。
      - name: Fetch bundled Horizon runtime
        shell: pwsh
        run: node scripts/fetch-horizon-runtime.mjs

      - name: Cargo test
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo clippy
        shell: pwsh
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
