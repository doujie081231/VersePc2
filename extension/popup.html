<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>VersePC2 下载接管</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 348px; margin: 0; padding: 14px;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 13px; color: #e6eef8; background: #0f151d;
    }

    header { display: flex; align-items: center; gap: 11px; margin: 2px 0 14px; }
    header img { width: 34px; height: 34px; border-radius: 9px; }
    h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .2px; }

    .card {
      background: #171f2a; border: 1px solid #26313f; border-radius: 12px;
      padding: 13px 14px; margin-bottom: 9px;
    }
    .card h2 {
      font-size: 11px; margin: 0 0 10px; color: #7c8fa6;
      font-weight: 600; letter-spacing: .6px; text-transform: uppercase;
    }

    .row { display: flex; align-items: center; gap: 8px; margin: 7px 0; font-size: 12.5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #5b6a7d; flex: 0 0 auto; }
    .dot.ok { background: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,.15); }
    .dot.bad { background: #f87171; box-shadow: 0 0 0 3px rgba(248,113,113,.15); }

    .path {
      font-size: 12px; color: #cfe0f5; word-break: break-all; line-height: 1.5;
      padding: 8px 10px; border-radius: 8px; background: #0c121a; border: 1px solid #202a36;
    }
    .path.ok { color: #86e7a8; border-color: #294a35; }

    .switch { display: flex; align-items: center; gap: 9px; margin: 9px 0; font-size: 13px; cursor: pointer; }
    .switch input { width: 15px; height: 15px; accent-color: #4f8cff; cursor: pointer; }

    .btns { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 11px; }
    button {
      padding: 7px 12px; font-size: 12.5px; border-radius: 8px; cursor: pointer;
      border: 1px solid #26313f; background: #1e2836; color: #cfe0f5;
      transition: background-color .15s ease, border-color .15s ease;
    }
    button:hover { background: #26313f; border-color: #33414f; }
    button.primary { background: #2f6fdd; border-color: #2f6fdd; color: #fff; }
    button.primary:hover { background: #3b7ceb; }

    #popScanBox { margin-top: 9px; max-height: 116px; overflow: auto; }
    .scan-item {
      display: flex; align-items: center; gap: 6px; padding: 7px 9px; margin-bottom: 5px;
      border: 1px solid #26313f; border-radius: 8px; background: #0c121a;
      font-size: 11.5px; cursor: pointer; word-break: break-all;
    }
    .scan-item:hover { border-color: #4f8cff; }
    .scan-item .rec { color: #86e7a8; flex: 0 0 auto; }

    #popHint { font-size: 11.5px; color: #7c8fa6; margin: 8px 0 0; line-height: 1.5; min-height: 0; }
    #lastInfo { font-size: 12.5px; color: #cfe0f5; margin: 0 0 6px; word-break: break-all; }
    #lastAttempt { font-size: 11.5px; color: #7c8fa6; margin: 0; }
    #status { font-size: 12px; min-height: 0; margin: 6px 2px 0; color: #7fd18a; }
    #status.err { color: #ff8f8f; }
    .foot { text-align: center; margin: 10px 0 0; }
    .foot a { font-size: 11.5px; color: #7aa7ff; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <img src="icons/48.png" alt="VersePC2" />
    <h1>VersePC2 下载接管</h1>
  </header>

  <div class="card">
    <h2>启动器位置</h2>
    <div class="path" id="popLauncherPath">跟随系统注册项</div>
    <div class="btns">
      <button id="btnPopScan" class="primary">一键扫描</button>
      <button id="btnPopPick">手动指定</button>
    </div>
    <div id="popScanBox" style="display:none;"></div>
    <p id="popHint"></p>
  </div>

  <div class="card">
    <h2>连接状态</h2>
    <div class="row"><span class="dot" id="dotHost"></span><span id="txtHost">检测中…</span></div>
    <div class="row"><span class="dot" id="dotLauncher"></span><span id="txtLauncher">检测中…</span></div>
    <div class="btns">
      <button id="btnTest">重新检测</button>
    </div>
  </div>

  <div class="card">
    <h2>接管开关</h2>
    <label class="switch"><input id="enabled" type="checkbox" /><span>启用下载接管</span></label>
    <label class="switch"><input id="useBrowserFolder" type="checkbox" /><span>使用浏览器保存目录</span></label>
  </div>

  <div class="card">
    <h2>最近一次</h2>
    <p id="lastInfo">暂无</p>
    <p id="lastAttempt"></p>
    <div class="btns">
      <button id="btnRetry">交给启动器</button>
      <button id="btnBrowser">改用浏览器</button>
    </div>
  </div>

  <div id="status"></div>
  <p class="foot"><a id="more">更多设置</a></p>

  <script src="popup.js"></script>
</body>
</html>
