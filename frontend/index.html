<!DOCTYPE html>
<!-- ==========================================================================
  VersePC - Minecraft 启动器 单页应用 (SPA)
  ============================================================================
  所有界面通过 CSS 的 .page.active 切换显示，每个 page 是一个功能模块。
  
  页面分区：
  1. 标题栏 (.title-bar) - 自定义窗口标题栏 + 窗口控制按钮
  2. 导航栏 (.sidebar) - 侧边栏功能导航 + 页面切换
  3. 启动栏 (.launch-bar) - 首页游戏封面 + 启动按钮 + 版本选择
  4. 页面容器 (.page-content) - 各功能页面内容
  
  页面列表：
  - page-home       首页/启动
  - page-versions   版本管理
  - page-mods       模组管理
  - page-modpacks   整合包
  - page-settings   设置
  - page-accounts   账户
  - page-java       Java管理
  - page-downloads  下载管理
  
  模态框：
  - launch-modal      启动模态框（步骤式进度）
  - deps-modal        依赖检查模态框
  - install-modal     版本安装模态框
  - mod-detail-modal  模组详情模态框
  ========================================================================== -->

  <!-- 尽早显示窗口：splash 一可见就用 Tauri 全局 API 显示窗口（不等所有脚本加载完），避免黑屏闪一下又不会太慢 -->
  <script>
    // 注意：CSP 通过 sha256 hash 放行本段内联脚本；修改内容后必须同步 tauri.conf.json 的 hash
    (function(){
      var ids = ['splash-logo','splash-text','splash-progress-container'];
      for (var i=0;i<ids.length;i++){
        var el = document.getElementById(ids[i]);
        if (el){ el.style.opacity='1'; el.style.transform='none'; el.style.animation='none'; }
      }
      // 优先：splash 已可见，直接用 Tauri 全局 API 显示窗口，最快
      try {
        if (window.__TAURI__ && window.__TAURI__.window) {
          window.__TAURI__.window.getCurrentWindow().show();
        }
      } catch (e) {}
      // 兜底：electronAPI 桥接层就绪后再试一次
      function _tryShow(){
        if (window.electronAPI && window.electronAPI.showWindowEarly) {
          window.electronAPI.showWindowEarly();
        }
      }
      _tryShow();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', _tryShow);
      } else {
        _tryShow();
      }
    })();
  </script>
