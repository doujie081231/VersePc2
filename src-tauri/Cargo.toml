[package]
name = "verse-tauri"
version = "1.7.2"
description = "VersePC - Minecraft ???"
license = "GPL-3.0"
edition = "2024"
# ?? rust-version ???????????let-chains ??? 2024 edition ???
rust-version = "1.95"
default-run = "verse-tauri"

[lib]
name = "verse_tauri_lib"
# ????? rlib ???cdylib/staticlib ??? iOS/mobile ???
# ??? Linux/macOS ??? cdylib ?????????? #[link]?? Windows ???
# ?? "unable to find library -lkernel32" ???????????????
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tokio = { version = "1", features = ["time", "fs", "io-util", "sync", "rt-multi-thread", "macros", "process", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
dirs = "5"
md5 = "0.7"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "blocking", "gzip", "deflate"] }
sha1 = "0.10"
futures-util = "0.3"
regex = "1"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
open = "5"
zip = "2"
urlencoding = "2"
if-addrs = "0.13"
flate2 = "1"
http = "1"
axum = { version = "0.7", features = [] }
tokio-tungstenite = { version = "0.21", features = ["rustls"] }

# theseus ?????????
async_zip = { version = "0.0.17", features = ["full", "tokio", "deflate", "chrono"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
rand = "0.8"
httpdate = "1"
derive_more = { version = "1", features = ["display"] }
eyre = "0.6"
tempfile = "3"
sha1_smol = "1"
futures-lite = "2"
governor = "0.7"
async-walkdir = "0.2"
tracing = "0.1"
futures = "0.3"
sysinfo = "0.30"

# Windows ????????????JavaSoft ???WebView2 ??????
# ??? windows target ????? macOS/Linux ??????
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# ============== Release ???? ==============
# ?? LTO + strip + ? codegen-unit ???? exe ??
[profile.release]
opt-level = "z"          # ??????????? 3 ????
lto = true               # ??????? crate ?????
codegen-units = 1        # ?????????????
strip = true             # ??????
panic = "unwind"         # ????/?????????????????????????????
